version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not yet compatible with the project's toolchain.
      # Minor and patch updates remain enabled.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      vite-tooling:
        patterns:
          - vite
          - "@vitejs/plugin-react"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Le action sono bloccate a SHA immutabili; Dependabot propone gli aggiornamenti.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
