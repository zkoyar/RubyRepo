name: CI

on:
  # Without a branch filter, every PR would run the three-system matrix twice:
  # once for the push to the branch and once for the pull request.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # One command instead of the eight steps this used to be, and not for
      # brevity: the steps had drifted from `verify`. They ran lint, tests,
      # build and clippy, but none of the three consistency checks, so a change
      # that left a sentence outside `t()` or named a message identifier the
      # dictionary does not know passed CI green while failing on any developer
      # machine. Calling `verify` makes the two the same thing by construction.
      #
      # It also routes the Rust tests through `scripts/windows-msvc.mjs`, which
      # they need on Windows.
      - name: Verify
        run: npm run verify

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `rustsec/audit-check` publishes its results as a check run: with only the
    # `contents: read` inherited from the workflow it would fail on permissions.
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without this step `npm audit` would run with the runner's Node instead
      # of the version declared in .nvmrc.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Audit npm
        run: npm audit --audit-level=high

      - name: Audit crates
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
