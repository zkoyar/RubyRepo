name: Release

# A release is accepted only from an existing strict-semver tag whose version
# matches every manifest. The source is verified before the three installers are
# built and attached to a draft release for manual review.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH; got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm tag exists and is checked out
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "The requested tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "$RELEASE_TAG")" ]]; then
            echo "HEAD is not the commit referenced by $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Match tag to package, Cargo and Tauri versions
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const expected = process.env.RELEASE_TAG.slice(1);
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const tauriConfig = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const cargoToml = fs.readFileSync("src-tauri/Cargo.toml", "utf8");
          const cargoLock = fs.readFileSync("src-tauri/Cargo.lock", "utf8");

          const cargoPackageSection = cargoToml
            .split(/^\[package\]\s*$/m)[1]
            ?.split(/^\[/m)[0];
          const cargoPackageVersion = cargoPackageSection
            ?.match(/^version\s*=\s*"([^"]+)"\s*$/m)?.[1];
          const cargoLockBlock = cargoLock
            .split("[[package]]")
            .find((block) => /^name\s*=\s*"rubyrepo"\s*$/m.test(block));
          const cargoLockVersion = cargoLockBlock
            ?.match(/^version\s*=\s*"([^"]+)"\s*$/m)?.[1];

          const versions = {
            "package.json": packageJson.version,
            "package-lock.json": packageLock.version,
            "package-lock.json packages['']": packageLock.packages?.[""]?.version,
            "src-tauri/Cargo.toml": cargoPackageVersion,
            "src-tauri/Cargo.lock": cargoLockVersion,
            "src-tauri/tauri.conf.json": tauriConfig.version,
          };
          const mismatches = Object.entries(versions)
            .filter(([, version]) => version !== expected);

          if (mismatches.length > 0) {
            console.error(`Tag ${process.env.RELEASE_TAG} expects version ${expected}.`);
            for (const [file, version] of mismatches) {
              console.error(`${file}: ${version ?? "missing"}`);
            }
            process.exit(1);
          }
          console.log(`All manifests match ${process.env.RELEASE_TAG}.`);
          NODE

      - name: Verify source
        run: npm run verify

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release_tag }}
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.verify.outputs.release_tag }}
          releaseName: RubyRepo ${{ needs.verify.outputs.release_tag }}
          releaseBody: |
            See the commit history for what changed in this version.

            **The installers are not signed.** Windows SmartScreen and macOS
            Gatekeeper will report them as coming from an unidentified
            developer: this is expected until a Windows certificate and Apple
            notarisation are configured.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
